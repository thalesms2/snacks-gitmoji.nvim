schema: spec-driven

context: |
  Tech stack: Neovim plugin written in Lua, targeting Neovim >= 0.9.
  Runtime dependency: folke/snacks.nvim (picker, input, and scratch modules).
  Domain: a gitmoji picker for git commit messages, modeled after
  olacin/telescope-gitmoji.nvim but built on Snacks.picker instead of Telescope.
  Conventions: no external deps besides snacks.nvim; plenary/busted for tests;
  stylua for formatting; plugin exposes `require("snacks-gitmoji").setup(opts)`
  and a `gitmoji()` entrypoint plus a user command `:SnacksGitmoji`.

